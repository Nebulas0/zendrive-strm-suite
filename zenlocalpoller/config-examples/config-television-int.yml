mosquitto:
  broker: mqtt.clearstreamer.com
  port: '443'
  client_id: zenserver-television-int-poller
  username: ${MQTT_USERNAME:-your-mqtt-user}
  password: ${MQTT_PASSWORD:-changeme}
  topic: s3
  qos: 2
  tls:
    enabled: true
mount:
  path: /mnt/unionfs/television-int/
  inclusions:
  - /mnt/unionfs/television-int/
  exclusions:
  - '**/lost+found/**'
  - '**/*.nfo'
  - '**/*.jpg'
rclone:
  enabled: true
  host: 127.0.0.1
  port: '5588'
  remote: zendrive-television-int
autoscan-servers:
- host: 127.0.0.1
  port: 3031
  username: plexuser
  password: ${AUTOSCAN_PASSWORD:-changeme}
  inclusions:
  - /mnt/unionfs/television-int/
  exclusions:
  - /mnt/unionfs/downloads/
  - /mnt/unionfs/transcodes/
- host: 127.0.0.1
  port: 3030
  username: plexuser
  password: ${AUTOSCAN_PASSWORD:-changeme}
  inclusions:
  - /mnt/unionfs/television-int/
  exclusions:
  - /mnt/unionfs/downloads/
  - /mnt/unionfs/transcodes/
  - /mnt/unionfs/.recyclebin/
  - /mnt/unionfs/.downloads/
  - /mnt/unionfs/.inbound/
paths:
  feeder_paths:
  - source: /media/zen-ceph/television/int/
    target: /mnt/unionfs/television-int/
database:
  path: /state/zenlocalpoller-television-int.db
  retention: 72h
poller:
  delay: 30s
  poll-interval: 30s
  retries: 5
log:
  level: info
